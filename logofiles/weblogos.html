<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>website logos</title>
    <style>
        body {
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        a {
            display: inline-block;
            margin: 10px;
            text-decoration: none;
        }
        img {
            width: 100px;
            height: auto;
            transition: transform 0.3s ease;
        }
        i {
            display: block;
            margin-top: 5px;
            font-size: 14px;
            color: #333;
        }
    </style>
</head>
<body>
    <a href="https://www.instagram.com/" alt="instagram" target="_blank"><img src="../images/instagram.webp" alt="instagram logo"></a><br>
    <i>Instagram</i>
    <a href="https://www.facebook.com/" alt="Facebook"  target="_blank"><img src="../images/facebook.webp" alt="Facebook logo"></a><br>
    <i>Facebook</i>
    <a href="https://www.linkedin.com/" alt="linkedin"  target="_blank"><img src="../images/linkedin.webp" alt="linkedin logo"></a><br>
    <i>LinkedIn</i>
    <a href="https://www.x.com/" alt="X"  target="_blank"><img src="../images/x.webp" alt="X logo"></a><br>
    <i>X</i>
    <a href="https://www.youtube.com/" alt="youtube"  target="_blank"><img src="../images/youtube.webp" alt="youtube logo"></a><br>
    <i>YouTube</i>
</body>
</html>
